<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

<link
  rel="icon"
  type="image/svg+xml"
  href="/favicon.svg"
/>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Favorites — NOMA</title>

  </head>

  <body>

<!-- HEADER -->

<header class="site-header">
  <div class="container">
    <div class="site-header__inner">

      <a
        class="site-header__logo"
        href="/"
      >
        NOMA
      </a>

      <nav
        class="site-header__nav"
        aria-label="Main navigation"
      >
        <ul class="site-header__nav-list">

          <li>
            <a
              class="site-header__nav-link"
              href="/products.html"
            >
              Shop
            </a>
          </li>

          <li>
            <a
              class="site-header__nav-link"
              href="/favorites.html"
            >
              Favorites
            </a>
          </li>

          <li>
            <a
              class="site-header__nav-link"
              href="/#about"
            >
              About
            </a>
          </li>

        </ul>
      </nav>

      <div class="site-header__actions">

        <button
          class="site-header__action"
          type="button"
          aria-label="Shopping cart"
        >
          Cart
          <span data-cart-count>0</span>
        </button>

        <button
          class="site-header__action site-header__menu"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
        >
          Menu
        </button>

      </div>

    </div>
  </div>


  <!-- MOBILE MENU -->

  <div
    class="mobile-menu"
    id="mobile-menu"
    aria-hidden="true"
  >

    <div class="mobile-menu__overlay"></div>

    <div
      class="mobile-menu__panel"
      role="dialog"
      aria-modal="true"
      aria-label="Mobile navigation"
    >

      <div class="mobile-menu__header">

        <a
          class="site-header__logo"
          href="/"
        >
          NOMA
        </a>

        <button
          class="mobile-menu__close"
          type="button"
          aria-label="Close menu"
        >
          Close
        </button>

      </div>

      <nav
        class="mobile-menu__nav"
        aria-label="Mobile navigation"
      >

        <ul class="mobile-menu__list">

          <li>
            <a
              class="mobile-menu__link"
              href="/products.html"
            >
              Shop
            </a>
          </li>

          <li>
            <a
              class="mobile-menu__link"
              href="/favorites.html"
            >
              Favorites
            </a>
          </li>

          <li>
            <a
              class="mobile-menu__link"
              href="/#about"
            >
              About
            </a>
          </li>

        </ul>

      </nav>

    </div>
  </div>

</header>


<!-- MAIN -->

<main>

  <section class="section favorites-page">

    <div class="container">

      <header class="favorites-page__header">

        <p class="favorites-page__eyebrow">
          NOMA FAVORITES
        </p>

        <h1 class="favorites-page__title">
          Your favorites
        </h1>

        <p class="favorites-page__description">
          The pieces you've saved for later.
        </p>

      </header>


      <div
        class="favorites-page__grid products-grid"
        data-favorites-grid
      ></div>


      <div
        class="favorites-page__empty"
        data-favorites-empty
        hidden
      >

        <h2 class="favorites-page__empty-title">
          Your favorites are empty.
        </h2>

        <p class="favorites-page__empty-text">
          Save products you love and find them here later.
        </p>

        <a
          class="btn btn--primary"
          href="/products.html"
        >
          Explore products
        </a>

      </div>

    </div>

  </section>

</main>


<!-- PRODUCT MODAL -->

<div
  class="product-modal"
  id="product-modal"
  aria-hidden="true"
>

  <div class="product-modal__overlay"></div>

  <div
    class="product-modal__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="product-modal-title"
  >

    <button
      class="product-modal__close"
      type="button"
      aria-label="Close product details"
    >
      Close
    </button>

    <div class="product-modal__content"></div>

  </div>

</div>


<!-- CART -->

<div
  class="cart"
  id="cart"
  aria-hidden="true"
>

  <div class="cart__overlay"></div>

  <aside
    class="cart__drawer"
    aria-label="Shopping cart"
  >

    <div class="cart__header">

      <h2 class="cart__title">
        Your cart
      </h2>

      <button
        class="cart__close"
        type="button"
        aria-label="Close shopping cart"
      >
        Close
      </button>

    </div>

    <div
      class="cart__items"
      data-cart-items
    ></div>

    <div class="cart__footer">

      <div class="cart__total">

        <span>Total</span>

        <strong data-cart-total>
          €0.00
        </strong>

      </div>

      <button
        class="btn btn--primary cart__checkout"
        type="button"
      >
        Checkout
      </button>

    </div>

  </aside>

</div>


<script
  type="module"
  src="/src/js/pages/favorites-page.js"
></script>


  </body>
</html>
