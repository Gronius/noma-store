<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOMA Admin — Products</title>
  </head>

  <body>
    <div class="admin-layout">
      <main class="admin-layout__main">
        <header class="admin-layout__header">
          <a class="admin-layout__brand" href="/admin/"> NOMA ADMIN </a>
          <a class="admin-layout__back" href="/admin/"> Dashboard </a>
        </header>

        <section class="admin-products">
          <header class="admin-products__header">
            <div>
              <p class="admin-products__eyebrow">STORE MANAGEMENT</p>

              <h1 class="admin-products__title">Products</h1>

              <p class="admin-products__description">
                Manage products available in the NOMA store.
              </p>
            </div>

            <button class="btn btn--primary" type="button" data-add-product>
              Add Product
            </button>
          </header>

          <div class="admin-products__form-wrapper"
            data-product-form-wrapper  hidden
          >

            <form class="admin-product-form"
              id="admin-product-form"
              data-product-form-mode="add"
              novalidate
            >
              <div class="admin-product-form__header">
                <div>
                  <p class="admin-product-form__eyebrow">PRODUCT MANAGEMENT</p>
                  <h2 class="admin-product-form__title" data-product-form-title>
                    Add Product
                  </h2>
                </div>

                <button class="btn btn--ghost"
                  type="button" data-cancel-product
                  >Cancel
                </button>
              </div>

              <div class="admin-product-form__fields">
                <div class="form-field">
                  <label class="form-label" for="product-title">
                    Product Title
                  </label>

                  <input class="form-input"
                    type="text" id="product-title"
                    name="title" required
                  />
                  <span class="form-error" data-error-for="title" hidden></span>
                </div>

                <div class="admin-product-form__row">
                  <div class="form-field">
                    <label class="form-label" for="product-category">
                      Category
                    </label>

                    <select class="form-select"
                      id="product-category" name="category"
                      required
                    >
                      <option value="">Choose category</option>
                      <option value="Furniture">Furniture</option>
                      <option value="Lighting">Lighting</option>
                      <option value="Decor">Decor</option>
                    </select>

                    <span class="form-error" data-error-for="category"
                      hidden
                    ></span>
                  </div>

                  <div class="form-field">
                    <label class="form-label" for="product-price">
                      Price
                    </label>

                    <input class="form-input" type="number"
                      id="product-price"
                      name="price"
                      min="0"
                      step="0.01"
                      required
                    />

                    <span class="form-error"
                      data-error-for="price"
                      hidden
                    ></span>
                  </div>
                </div>

                <div class="form-field">
                  <label class="form-label" for="product-image">
                    Image URL
                  </label>

                  <input class="form-input"
                    type="url"
                    id="product-image"
                    name="image"
                    placeholder="https://..."
                    data-product-image-url
                  />

                  <span class="form-error" data-error-for="image" hidden></span>

                  <div class="admin-product-form__image-preview"
                    data-product-image-preview
                    hidden
                  >
                    <p class="admin-product-form__image-preview-label">
                      Image Preview
                    </p>
                    <div class="admin-product-form__image-preview-media">
                      <img src="#" alt="" data-product-image-preview-img />
                    </div>
                  </div>
                </div>

                <div class="form-field">
                  <label class="form-label" for="product-alt">
                    Image Alt Text
                  </label>

                  <input class="form-input"
                    type="text"
                    id="product-alt"
                    name="alt"
                    required
                    data-product-alt
                  />

                  <span class="form-error" data-error-for="alt" hidden></span>
                </div>

                <div class="form-field">
                  <label class="form-label" for="product-description">
                    Description
                  </label>

                  <textarea class="form-textarea"
                    id="product-description"
                    name="description"
                    required
                  ></textarea>

                  <span class="form-error"
                    data-error-for="description"
                    hidden
                  ></span>
                </div>

                <div class="form-field">
                  <label class="form-label" for="product-badge"> Badge </label>

                  <select class="form-select" id="product-badge" name="badge">
                    <option value="">No badge</option>

                    <option value="New">New</option>

                    <option value="Sale">Sale</option>
                  </select>
                </div>

                <label class="admin-product-form__checkbox">
                  <input type="checkbox" name="featured" />

                  <span> Featured product </span>
                </label>
              </div>

              <div class="admin-product-form__actions">
                <button class="btn btn--primary"
                  type="submit"
                  data-product-submit
                >Save Product
                </button>

                <button class="btn btn--secondary"
                  type="button" data-cancel-product
                >Cancel
                </button>
              </div>
            </form>
          </div>

          <!-- панель Products v3: -->
          <div class="admin-products__toolbar">

            <div class="form-field admin-products__search">
              <label  class="form-label"
                for="products-search"
              >
                Search products
              </label>

              <input class="form-input"
                type="search"
                id="products-search"
                placeholder="Search by product title..."
                data-products-search
              />
            </div>

            <div class="form-field admin-products__category">
              <label class="form-label"
                for="products-category"
              >
                Category
              </label>

              <select  class="form-select"
                id="products-category"
                data-products-category
              >
                <option value="all">
                  All categories
                </option>

                <option value="Furniture">
                  Furniture
                </option>

                <option value="Lighting">
                  Lighting
                </option>

                <option value="Decor">
                  Decor
                </option>
              </select>
            </div>

            <div class="form-field admin-products__sort">
  <label
    class="form-label"
    for="products-sort"
  >
    Sort by
  </label>

  <select
    class="form-select"
    id="products-sort"
    data-products-sort
  >
    <option value="newest">
      Newest
    </option>

    <option value="name">
      Name
    </option>

    <option value="price-asc">
      Price: Low to High
    </option>

    <option value="price-desc">
      Price: High to Low
    </option>

    <option value="category">
      Category
    </option>
  </select>
</div>

          </div>

          <p   class="admin-products__count"
            data-products-count
          >   0 products
          </p>


          <div class="admin-products__table-wrapper">
            <table class="admin-products__table">
              <thead>
                <tr>
                  <th scope="col">Product</th>
                  <th scope="col">Category</th>
                  <th scope="col">Price</th>
                  <th scope="col">Featured</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>

              <tbody data-products-table>
                <!-- Products rendered with JavaScript -->
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/js/admin/products.js"></script>
  </body>
</html>
