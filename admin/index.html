<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />


<link
  rel="icon"
  type="image/svg+xml"
  href="/favicon.svg"
/>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>NOMA Admin — Dashboard</title>


  </head>

  <body>

<div class="admin-layout">

  <main class="admin-layout__main">

    <header class="admin-layout__header">

      <a
        class="admin-layout__brand"
        href="/admin/"
      >
        NOMA ADMIN
      </a>

      <a
        class="admin-layout__back"
        href="/"
      >
        Back to store
      </a>

    </header>

    <section class="dashboard">

      <header class="dashboard__header">

        <p class="dashboard__eyebrow">
          ADMIN DASHBOARD
        </p>

        <h1 class="dashboard__title">
          Overview
        </h1>

        <p class="dashboard__description">
          A quick overview of your store performance
          and recent orders.
        </p>

      </header>

      <div
        class="dashboard__stats"
        data-dashboard-stats
      >

        <article class="dashboard-stat">

          <span class="dashboard-stat__label">
            Total Products
          </span>

          <strong
            class="dashboard-stat__value"
            data-stat="products"
          >
            0
          </strong>

        </article>

        <article class="dashboard-stat">

          <span class="dashboard-stat__label">
            Total Orders
          </span>

          <strong
            class="dashboard-stat__value"
            data-stat="orders"
          >
            0
          </strong>

        </article>

        <article class="dashboard-stat">

          <span class="dashboard-stat__label">
            Total Revenue
          </span>

          <strong
            class="dashboard-stat__value"
            data-stat="revenue"
          >
            €0.00
          </strong>

        </article>

        <article class="dashboard-stat">

          <span class="dashboard-stat__label">
            Pending Orders
          </span>

          <strong
            class="dashboard-stat__value"
            data-stat="pending"
          >
            0
          </strong>

        </article>

      </div>

      <section class="dashboard__recent">

        <header class="dashboard__recent-header">
  <h2 class="dashboard__recent-title">
    Recent Orders
  </h2>

  <a
    class="btn btn--ghost"
    href="/admin/orders.html"
  >
    View all
  </a>
</header>

<div class="dashboard__orders">

  <div class="dashboard-order dashboard-order--head">
    <span>Order</span>
    <span>Customer</span>
    <span>Date</span>
    <span>Total</span>
    <span>Status</span>
  </div>

  <div
    class="dashboard__orders-list"
    data-recent-orders
  ></div>

</div>

        <!-- <header class="dashboard__recent-header">

          <h2 class="dashboard__recent-title">
            Recent Orders
          </h2>

          <a
            class="btn btn--ghost"
            href="/admin/orders.html"
          >
            View all
          </a>

        </header>

        <div
          class="dashboard__orders"
          data-recent-orders
        ></div> -->

      </section>

    </section>

  </main>

</div>

<script  type="module"
  src="/src/js/admin/dashboard.js"
></script>

  </body>
</html>
