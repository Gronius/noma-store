<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />


<link
  rel="icon"
  type="image/svg+xml"
  href="/favicon.svg"
/>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Products — NOMA</title>


  </head>

  <body>


<!-- HEADER -->

<header class="site-header">
  <div class="container">
    <div class="site-header__inner">

      <a
        class="site-header__logo"
        href="/"
      >
        NOMA
      </a>

      <!-- Desktop Navigation -->

      <nav
        class="site-header__nav"
        aria-label="Main navigation"
      >
        <ul class="site-header__nav-list">

          <li>
            <a
              class="site-header__nav-link"
              href="/products.html"
            >
              Shop
            </a>
          </li>

          <li>
            <a
              class="site-header__nav-link"
              href="/products.html"
            >
              New
            </a>
          </li>

          <li>
            <a
              class="site-header__nav-link"
              href="/#about"
            >
              About
            </a>
          </li>

        </ul>
      </nav>

      <!-- Header Actions -->

      <div class="site-header__actions">

        <button
          class="site-header__action"
          type="button"
          aria-label="Search"
        >
          Search
        </button>

        <button
          class="site-header__action"
          type="button"
          aria-label="Shopping cart"
        >
          Cart
          <span data-cart-count>0</span>
        </button>

        <button
          class="site-header__action site-header__menu"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
        >
          Menu
        </button>

      </div>

    </div>
  </div>

  <!-- Mobile Menu -->

  <div
    class="mobile-menu"
    id="mobile-menu"
    aria-hidden="true"
  >

    <div class="mobile-menu__overlay"></div>

    <div
      class="mobile-menu__panel"
      role="dialog"
      aria-modal="true"
      aria-label="Mobile navigation"
    >

      <div class="mobile-menu__header">

        <a
          class="site-header__logo"
          href="/"
        >
          NOMA
        </a>

        <button
          class="mobile-menu__close"
          type="button"
          aria-label="Close menu"
        >
          Close
        </button>

      </div>

      <nav
        class="mobile-menu__nav"
        aria-label="Mobile navigation"
      >

        <ul class="mobile-menu__list">

          <li>
            <a
              class="mobile-menu__link"
              href="/products.html"
            >
              Shop
            </a>
          </li>

          <li>
            <a
              class="mobile-menu__link"
              href="/products.html"
            >
              New
            </a>
          </li>

          <li>
            <a
              class="mobile-menu__link"
              href="/#about"
            >
              About
            </a>
          </li>

        </ul>

      </nav>

    </div>
  </div>

</header>


<!-- MAIN -->

<main>

  <section class="section products-page">

    <div class="container">

      <!-- Page Header -->

      <div class="products-page__header">

        <p class="products-page__eyebrow">
          NOMA COLLECTION
        </p>

        <h1 class="products-page__title">
          Our Products
        </h1>

        <p class="products-page__description">
          Thoughtfully selected objects designed
          for calm and everyday living.
        </p>

      </div>


      <!-- Category Filters -->

      <div
        class="products-page__filters"
        aria-label="Product categories"
      >

        <button
          class="products-page__filter is-active"
          type="button"
          data-category="all"
        >
          All
        </button>

        <button
          class="products-page__filter"
          type="button"
          data-category="Furniture"
        >
          Furniture
        </button>

        <button
          class="products-page__filter"
          type="button"
          data-category="Lighting"
        >
          Lighting
        </button>

        <button
          class="products-page__filter"
          type="button"
          data-category="Decor"
        >
          Decor
        </button>

      </div>


      <!-- Products -->

      <div
        class="products-grid"
        data-products-grid
      ></div>

      <div class="products-load-more">
        <p class="products-load-more__count" data-products-count></p>

        <button
          class="btn btn--secondary"
          type="button"
          data-load-more
          >
          Дивитися далі
        </button>
      </div>

    </div>

  </section>

</main>


<!-- PRODUCT MODAL -->

<div
  class="product-modal"
  id="product-modal"
  aria-hidden="true"
>

  <div class="product-modal__overlay"></div>

  <div
    class="product-modal__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="product-modal-title"
  >

    <button
      class="product-modal__close"
      type="button"
      aria-label="Close product details"
    >
      Close
    </button>

    <div class="product-modal__content">
      <!-- Product data will be inserted here -->
    </div>

  </div>

</div>


<!-- CART -->

<div
  class="cart"
  id="cart"
  aria-hidden="true"
>

  <div class="cart__overlay"></div>

  <aside
    class="cart__drawer"
    aria-label="Shopping cart"
  >

    <div class="cart__header">

      <h2 class="cart__title">
        Your cart
      </h2>

      <button
        class="cart__close"
        type="button"
        aria-label="Close shopping cart"
      >
        Close
      </button>

    </div>


    <div
      class="cart__items"
      data-cart-items
    >
      <!-- Cart items will be rendered here -->
    </div>


    <div class="cart__footer">

      <div class="cart__total">

        <span>Total</span>

        <strong data-cart-total>
          €0.00
        </strong>

      </div>


      <button
        class="btn btn--primary cart__checkout"
        type="button"
      >
        Checkout
      </button>

    </div>

  </aside>

</div>


<script
  type="module"
  src="/src/js/pages/products.js"
></script>


  </body>
</html>
